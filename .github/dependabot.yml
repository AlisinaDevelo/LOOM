version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust:
        patterns: ["*"]
    ignore:
      # These releases require Rust 1.90; keep Rust 1.88 until #329 is decided.
      - dependency-name: tauri
        versions: [">=2.12"]
      - dependency-name: tauri-build
        versions: [">=2.7"]
      - dependency-name: tauri-codegen
        versions: [">=2.7"]
      - dependency-name: tauri-macros
        versions: [">=2.7"]
      - dependency-name: tauri-plugin
        versions: [">=2.7"]
      - dependency-name: tauri-plugin-dialog
        versions: [">=2.8"]
      - dependency-name: tauri-plugin-fs
        versions: [">=2.6"]
      - dependency-name: tauri-runtime
        versions: [">=2.12"]
      - dependency-name: tauri-runtime-wry
        versions: [">=2.12"]
      - dependency-name: tauri-utils
        versions: [">=2.10"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # typescript-eslint 8.x declares typescript <6.1 as its peer range; take TypeScript majors
      # together with a typescript-eslint release that supports them.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Temporary until #329 resolves the Rust 1.88/Tauri compatibility policy.
      - dependency-name: "@tauri-apps/api"
        versions: [">= 2.12"]
      - dependency-name: "@tauri-apps/cli"
        versions: [">= 2.12"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # CodeQL init and analyze must run the same version or the analyze step fails.
      codeql:
        patterns: ["github/codeql-action/*"]
