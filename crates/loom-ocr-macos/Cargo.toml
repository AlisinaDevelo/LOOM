[package]
name = "loom-ocr-macos"
description = "Audited macOS Vision OCR provider for LOOM"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
    "NSValue",
] }
objc2-image-io = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGImageProperties",
    "objc2",
] }
objc2-vision = { version = "0.3.2", default-features = false, features = [
    "std",
    "VNObservation",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
    "VNRequestRevisionProviding",
    "VNTypes",
    "objc2-core-foundation",
    "objc2-image-io",
] }
